server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Handle React Router paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets
    location ~* \.(?:css|js|jpg|svg|png|gif|ico|eot|ttf|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public";
    }
}

version: '3.8'

services:
  server:
    build: ./server
    container_name: hirevaani_server
    ports:
      - "8080:5000"
    env_file:
      - ./server/.env
    environment:
      - PORT=5000
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:8080/api
    container_name: hirevaani_client
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped
